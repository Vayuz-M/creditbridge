name: CreditBridge CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Test and Verify Backend Python ML Engine
  # -------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install email-validator pytest httpx

      - name: Initialize System & Models
        run: |
          cd backend
          python init_system.py

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest tests -v

      - name: Run Commercial Deployment Audit
        run: |
          cd backend
          python run_audit.py

  # -------------------------------------------------------------
  # Job 2: Build & Lint Frontend React Application
  # -------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build
