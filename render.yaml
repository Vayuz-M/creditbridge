# Render Infrastructure as Code (Blueprint)
# https://render.com/docs/blueprint-spec
version: "1"

databases:
  - name: creditbridge-postgres
    plan: free
    region: oregon
    databaseName: creditbridge
    user: creditbridge_user

services:
  # ==========================================
  # CreditBridge FastAPI & ML Web Service
  # ==========================================
  - type: web
    name: creditbridge-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: creditbridge-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_DOCS
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
